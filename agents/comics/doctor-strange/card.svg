<svg xmlns="http://www.w3.org/2000/svg" width="420" height="245" viewBox="0 0 420 245">
  <defs>
    <linearGradient id="bg-doctor-strange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b4e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-doctor-strange" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="420" height="245" rx="16" fill="url(#bg-doctor-strange)" filter="url(#shadow-doctor-strange)"/>
  <rect x="0" y="0" width="420" height="4" rx="2" fill="#c0392b"/>

  <!-- Emoji -->
  <text x="35" y="72" font-size="48">✨</text>

  <!-- Name -->
  <text x="95" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#ffffff" font-weight="700">Doctor Strange</text>

  <!-- Category badge -->
  <rect x="95" y="68" width="62" height="22" rx="11" fill="#c0392b" opacity="0.35"/>
  <text x="126" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Comics</text>

  <!-- One-liner -->
  <text x="30" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ecf0f1" opacity="0.9">
    <tspan x="30" dy="0">I've looked at 14,000,605 futures</tspan>
    <tspan x="30" dy="18">— this is the one where your code works</tspan>
  </text>

  <!-- Tags -->
  <rect x="30" y="195" width="62" height="24" rx="12" fill="#c0392b" opacity="0.25"/>
  <text x="61" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="500">comics</text>
  <rect x="100" y="195" width="72" height="24" rx="12" fill="#c0392b" opacity="0.25"/>
  <text x="136" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="500">superhero</text>
  <rect x="180" y="195" width="72" height="24" rx="12" fill="#c0392b" opacity="0.25"/>
  <text x="216" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="500">mystical</text>
  <rect x="260" y="195" width="82" height="24" rx="12" fill="#c0392b" opacity="0.25"/>
  <text x="301" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="500">analytical</text>
</svg>
