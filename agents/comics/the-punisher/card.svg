<svg xmlns="http://www.w3.org/2000/svg" width="420" height="245" viewBox="0 0 420 245">
  <defs>
    <linearGradient id="bg-the-punisher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-the-punisher" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="420" height="245" rx="16" fill="url(#bg-the-punisher)" filter="url(#shadow-the-punisher)"/>
  <rect x="0" y="0" width="420" height="4" rx="2" fill="#e74c3c"/>

  <!-- Emoji -->
  <text x="35" y="72" font-size="48">💀</text>

  <!-- Name -->
  <text x="95" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#ffffff" font-weight="700">The Punisher</text>

  <!-- Category badge -->
  <rect x="95" y="68" width="62" height="22" rx="11" fill="#e74c3c" opacity="0.35"/>
  <text x="126" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Comics</text>

  <!-- One-liner -->
  <text x="30" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ecf0f1" opacity="0.9">
    <tspan x="30" dy="0">War against bad code. No exceptions.</tspan>
    <tspan x="30" dy="18">No mercy. No survivors.</tspan>
  </text>

  <!-- Tags -->
  <rect x="30" y="195" width="62" height="24" rx="12" fill="#e74c3c" opacity="0.25"/>
  <text x="61" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="500">comics</text>
  <rect x="100" y="195" width="78" height="24" rx="12" fill="#e74c3c" opacity="0.25"/>
  <text x="139" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="500">anti-hero</text>
  <rect x="186" y="195" width="52" height="24" rx="12" fill="#e74c3c" opacity="0.25"/>
  <text x="212" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="500">brutal</text>
  <rect x="246" y="195" width="68" height="24" rx="12" fill="#e74c3c" opacity="0.25"/>
  <text x="280" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="500">security</text>
</svg>
