<svg xmlns="http://www.w3.org/2000/svg" width="420" height="245" viewBox="0 0 420 245">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="420" height="245" rx="16" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="0" y="0" width="420" height="4" rx="2" fill="#fd79a8"/>
  
  <!-- Emoji -->
  <text x="35" y="72" font-size="48">✨</text>
  
  <!-- Name -->
  <text x="95" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#ffffff" font-weight="700">Oprah Winfrey</text>
  
  <!-- Category badge -->
  <rect x="95" y="68" width="136" height="22" rx="11" fill="#fd79a8" opacity="0.25"/>
  <text x="163" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fd79a8" text-anchor="middle" font-weight="600">Cultural Icons</text>
  
  <!-- One-liner -->
  <text x="30" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" opacity="0.9">
    <tspan x="30" dy="0">The woman who turned a talk show into a cultural institution</tspan>
    <tspan x="30" dy="18">by understanding that everybody has a story worth telling —</tspan>
    <tspan x="30" dy="18">including her own</tspan>
  </text>
  
  <!-- Tags -->
    <rect x="30" y="195" width="65" height="24" rx="12" fill="#fd79a8" opacity="0.2"/>
    <text x="62" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fd79a8" text-anchor="middle" font-weight="500">culture</text>
    <rect x="103" y="195" width="93" height="24" rx="12" fill="#fd79a8" opacity="0.2"/>
    <text x="149" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fd79a8" text-anchor="middle" font-weight="500">inspiration</text>
    <rect x="204" y="195" width="100" height="24" rx="12" fill="#fd79a8" opacity="0.2"/>
    <text x="254" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fd79a8" text-anchor="middle" font-weight="500">storytelling</text>
    <rect x="312" y="195" width="86" height="24" rx="12" fill="#fd79a8" opacity="0.2"/>
    <text x="355" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fd79a8" text-anchor="middle" font-weight="500">leadership</text>

</svg>