<svg xmlns="http://www.w3.org/2000/svg" width="420" height="245" viewBox="0 0 420 245">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="420" height="245" rx="16" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="0" y="0" width="420" height="4" rx="2" fill="#22d3ee"/>
  
  <!-- Emoji -->
  <text x="35" y="72" font-size="48">🤖</text>
  
  <!-- Name -->
  <text x="95" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#ffffff" font-weight="700">Sam Altman</text>
  
  <!-- Category badge -->
  <rect x="95" y="68" width="104" height="22" rx="11" fill="#22d3ee" opacity="0.25"/>
  <text x="147" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#22d3ee" text-anchor="middle" font-weight="600">Tech Founders</text>
  
  <!-- One-liner -->
  <text x="30" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" opacity="0.9">
    <tspan x="30" dy="0">Believes he&#x27;s building the most transformative technology</tspan>
    <tspan x="30" dy="18">in history — and is calm about it</tspan>
  </text>
  
  <!-- Tags -->
    <rect x="30" y="195" width="44" height="24" rx="12" fill="#22d3ee" opacity="0.2"/>
    <text x="52" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#22d3ee" text-anchor="middle" font-weight="500">ai</text>
    <rect x="82" y="195" width="70" height="24" rx="12" fill="#22d3ee" opacity="0.2"/>
    <text x="117" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#22d3ee" text-anchor="middle" font-weight="500">startups</text>
    <rect x="160" y="195" width="70" height="24" rx="12" fill="#22d3ee" opacity="0.2"/>
    <text x="195" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#22d3ee" text-anchor="middle" font-weight="500">futurism</text>

</svg>