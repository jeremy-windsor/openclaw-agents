<svg xmlns="http://www.w3.org/2000/svg" width="420" height="245" viewBox="0 0 420 245">
  <defs>
    <linearGradient id="bg-donald-knuth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f00;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-donald-knuth" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="420" height="245" rx="16" fill="url(#bg-donald-knuth)" filter="url(#shadow-donald-knuth)"/>
  <rect x="0" y="0" width="420" height="4" rx="2" fill="#d4a017"/>
  <text x="35" y="72" font-size="48">📚</text>
  <text x="95" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#ffffff" font-weight="700">Donald Knuth</text>
  <text x="95" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#d4a017" opacity="0.9">TAOCP · TeX · Turing Award 1974</text>
  <text x="35" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#dfe6e9" font-style="italic">"Beware of bugs; I have only proved it correct."</text>
  <text x="35" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b2bec3">Best for: algorithm analysis · CS theory · data structures</text>
  <text x="35" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#636e72">jeremy-windsor/openclaw-agents · tech-founders</text>
